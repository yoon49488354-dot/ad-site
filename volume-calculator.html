<body>
  <div data-shared-component="header"></div>
  <div data-shared-component="coupang-banner"></div> ← 이미 삽입됨
  <main class="container page-main">
    <main class="container page-main">
      <section class="intro" aria-labelledby="page-title">
        <span class="eyebrow">VOLUME CONVERTER</span>
        <h1 id="page-title"><span>부피 단위</span>를 쉽고 빠르게!</h1>
        <p>부피와 단위를 선택하면 환산 결과가 바로 계산됩니다.</p>
      </section>

      <section class="unit-conversion-card" aria-label="부피 단위 변환">
        <div class="unit-conversion-controls">
          <div class="unit-conversion-input-field">
            <label for="volume-value">변환할 부피</label>
            <div class="unit-conversion-value">
              <input id="volume-value" type="text" inputmode="decimal" autocomplete="off" value="1"
                aria-describedby="volume-input-error">
            </div>
            <p class="unit-conversion-error" id="volume-input-error" role="alert"></p>
          </div>
          <div class="unit-conversion-select-field unit-conversion-select-field--from">
            <label for="volume-from">변환 전 단위</label>
            <select id="volume-from"></select>
          </div>
          <button class="unit-swap-button" id="volume-swap" type="button" aria-label="변환 전후 단위 바꾸기"
            title="단위 바꾸기">⇄</button>
          <div class="unit-conversion-select-field unit-conversion-select-field--to">
            <label for="volume-to">변환 후 단위</label>
            <select id="volume-to"></select>
          </div>
        </div>

        <section class="unit-conversion-result" aria-live="polite" aria-labelledby="volume-result-heading">
          <p id="volume-result-heading" class="unit-conversion-result__label">변환 결과</p>
          <strong class="unit-conversion-result__value" id="volume-result">0.001 liter</strong>
          <p class="unit-conversion-result__equation" id="volume-equation">1 cc = 0.001 liter</p>
        </section>
      </section>

      <section class="unit-reference-card" aria-labelledby="volume-table-heading">
        <div class="unit-section-heading">
          <span class="section-heading__number">01</span>
          <div>
            <h2 id="volume-table-heading">부피 변환표</h2>
            <p id="volume-table-summary">행은 변환 전, 열은 변환 후 단위입니다.</p>
          </div>
        </div>
        <div class="unit-table-scroll" tabindex="0" aria-label="부피 단위 변환표">
          <table class="unit-reference-table unit-reference-table--matrix" id="volume-reference-table">
            <thead id="volume-table-head"></thead>
            <tbody id="volume-table-body"></tbody>
          </table>
        </div>
      </section>

      <section class="unit-reference-card unit-formula-card" aria-labelledby="volume-formula-heading">
        <div class="unit-section-heading">
          <span class="section-heading__number">02</span>
          <div>
            <h2 id="volume-formula-heading">단위 변환 방법</h2>
            <p id="volume-formula-description"></p>
          </div>
        </div>
        <p class="unit-formula" id="volume-formula"></p>
      </section>
    </main>
    <div data-shared-component="footer"></div>
    <script src="Assets/js/components.js"></script>
    <script src="Assets/js/volume-converter.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="제곱미터, 제곱킬로미터, 에이커, 아르, 제곱피트, 헥타르, 제곱야드, 평을 바로 변환해보세요.">
    <title>면적 변환기</title>
    <link rel="stylesheet" href="Assets/css/normalize.css">
    <link rel="stylesheet" href="Assets/css/Reset.css">
    <link rel="stylesheet" href="Assets/css/Commons.css">
    <link rel="stylesheet" href="Assets/css/style.css">
  </head>
  <body>
    <div data-shared-component="header"></div>
    <main class="container page-main">
      <section class="intro" aria-labelledby="page-title">
        <span class="eyebrow">AREA CONVERTER</span>
        <h1 id="page-title"><span>면적 단위</span>를 쉽고 빠르게!</h1>
        <p>면적과 단위를 선택하면 환산 결과가 바로 계산됩니다.</p>
      </section>

      <section class="unit-conversion-card" aria-label="면적 단위 변환">
        <div class="unit-conversion-controls">
          <div class="unit-conversion-input-field">
            <label for="area-value">변환할 면적</label>
            <div class="unit-conversion-value">
              <input id="area-value" type="text" inputmode="decimal" autocomplete="off" value="1" aria-describedby="area-input-error">
            </div>
            <p class="unit-conversion-error" id="area-input-error" role="alert"></p>
          </div>
          <div class="unit-conversion-select-field unit-conversion-select-field--from">
            <label for="area-from">변환 전 단위</label>
            <select id="area-from"></select>
          </div>
          <button class="unit-swap-button" id="area-swap" type="button" aria-label="변환 전후 단위 바꾸기" title="단위 바꾸기">⇄</button>
          <div class="unit-conversion-select-field unit-conversion-select-field--to">
            <label for="area-to">변환 후 단위</label>
            <select id="area-to"></select>
          </div>
        </div>

        <section class="unit-conversion-result" aria-live="polite" aria-labelledby="area-result-heading">
          <p id="area-result-heading" class="unit-conversion-result__label">변환 결과</p>
          <strong class="unit-conversion-result__value" id="area-result">0.3025 평</strong>
          <p class="unit-conversion-result__equation" id="area-equation">1 m² = 0.3025 평</p>
        </section>
      </section>

      <section class="unit-reference-card" aria-labelledby="area-table-heading">
        <div class="unit-section-heading">
          <span class="section-heading__number">01</span>
          <div>
            <h2 id="area-table-heading">면적 변환표</h2>
            <p id="area-table-summary">행은 변환 전, 열은 변환 후 단위입니다.</p>
          </div>
        </div>
        <div class="unit-table-scroll" tabindex="0" aria-label="면적 단위 변환표">
          <table class="unit-reference-table unit-reference-table--matrix" id="area-reference-table">
            <thead id="area-table-head"></thead>
            <tbody id="area-table-body"></tbody>
          </table>
        </div>
      </section>

      <section class="unit-reference-card unit-formula-card" aria-labelledby="area-formula-heading">
        <div class="unit-section-heading">
          <span class="section-heading__number">02</span>
          <div>
            <h2 id="area-formula-heading">단위 변환 방법</h2>
            <p id="area-formula-description"></p>
          </div>
        </div>
        <p class="unit-formula" id="area-formula"></p>
      </section>
    </main>
    <div data-shared-component="footer"></div>
    <script src="Assets/js/components.js"></script>
    <script src="Assets/js/area-converter.js"></script>
  </body>
</html>
